<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Smart Alerts | Smart City Digital Twin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet"><link href="{{ url_for('static', filename='css/modules.css') }}" rel="stylesheet">
</head><body><div class="sc-page">
<div class="page-header"><h1><i class="bi bi-bell-fill me-2"></i>Smart Alerts</h1><p>Central place for high-risk and operational notifications from connected modules.</p><span class="ml-badge"><i class="bi bi-shield-check"></i> CITY MONITORING</span></div>
<div class="glass-card"><div class="section-title"><i class="bi bi-exclamation-diamond-fill"></i>Active Alerts</div><div id="alerts">Loading alerts...</div></div>
</div><script>
async function loadAlerts(){const el=document.getElementById('alerts');try{const r=await fetch('/api/alerts/');const x=await r.json();const a=x.alerts||[];el.innerHTML=a.length?a.map(v=>`<div class="alert-row"><span class="badge ${v.level==='high'?'red':v.level==='critical'?'red':'yellow'}">${v.level||'info'}</span><div><div class="alert-title">${v.title||'City Alert'}</div><div class="alert-message">${v.message||''}</div></div><span class="alert-time">${v.timestamp||''}</span></div>`).join(''):'<div class="status-panel">No active alerts yet. Alerts will appear after predictions are connected.</div>'}catch(e){el.innerHTML='<div class="error-box" style="display:block">Unable to load alerts.</div>'}}loadAlerts();
</script></body></html>
