<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reports | Smart City Digital Twin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet"><link href="{{ url_for('static', filename='css/modules.css') }}" rel="stylesheet">
</head><body><div class="sc-page">
<div class="page-header"><h1><i class="bi bi-file-earmark-bar-graph-fill me-2"></i>City Reports</h1><p>Generate a summary of all connected smart city modules and datasets.</p><span class="ml-badge"><i class="bi bi-clipboard-data-fill"></i> CITY INTELLIGENCE REPORTING</span></div>
<div class="glass-card"><div class="report-toolbar"><div><div class="section-title mb-1"><i class="bi bi-bar-chart-fill"></i>System Summary</div><div style="color:#7f91a8;font-size:13px">Current dataset availability and record counts.</div></div><button class="btn-main" id="refreshReport" type="button"><i class="bi bi-arrow-clockwise me-1"></i> Refresh Report</button></div><div id="report">Loading report...</div></div>
</div><script>
async function loadReport(){const el=document.getElementById('report');el.innerHTML='<div class="loading" style="display:block">Loading report...</div>';try{const r=await fetch('/api/reports/summary');const x=await r.json();if(!r.ok||!x.success)throw new Error(x.message||'Report unavailable.');const modules=x.report?.modules||{};const entries=Object.entries(modules);el.innerHTML=entries.length?`<div class="row g-4">${entries.map(([k,v])=>`<div class="col-md-6 col-lg-4"><div class="result-info-card"><span>${k.replaceAll('_',' ').toUpperCase()}</span>${v.available?`<div class="metric-number">${v.records}</div><p style="margin:5px 0 0;color:#9caec4;font-size:12px">records • ${v.columns} columns</p>`:'<strong style="color:#ffd43b">Dataset not connected yet.</strong>'}</div></div>`).join('')}</div>`:'<div class="status-panel">No report data available.</div>'}catch(e){el.innerHTML=`<div class="error-box" style="display:block">${e.message}</div>`}}document.getElementById('refreshReport').addEventListener('click',loadReport);loadReport();
</script></body></html>
