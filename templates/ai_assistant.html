<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>City Assistant | Smart City Digital Twin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet"><link href="{{ url_for('static', filename='css/modules.css') }}" rel="stylesheet">
</head><body><div class="sc-page">
<div class="page-header"><h1><i class="bi bi-robot me-2"></i>City Assistant</h1><p>Ask questions about city systems and receive operator-friendly explanations.</p><span class="ml-badge"><i class="bi bi-chat-dots-fill"></i> DECISION SUPPORT</span></div>
<div class="glass-card chat-panel"><div class="section-title"><i class="bi bi-chat-square-text"></i>City Intelligence Assistant</div><div class="messages" id="messages"><div class="msg bot">Hello! 👋 Ask me about traffic, air quality, accidents, energy, weather or simulations.</div></div><form class="chat-form" id="chatForm"><input id="question" placeholder="Ask something about the city..." required><button class="btn-main" type="submit">Send</button></form></div>
</div><script>
document.getElementById('chatForm').addEventListener('submit',async e=>{e.preventDefault();const input=document.getElementById('question'),messages=document.getElementById('messages'),q=input.value.trim();if(!q)return;messages.innerHTML+=`<div class="msg user"></div>`;messages.lastElementChild.textContent=q;input.value='';try{const r=await fetch('/api/assistant/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});const x=await r.json();const m=document.createElement('div');m.className='msg bot';m.textContent=x.answer||x.message||'No response received.';messages.appendChild(m)}catch(e){const m=document.createElement('div');m.className='msg bot';m.textContent='Unable to connect to the assistant service.';messages.appendChild(m)}messages.scrollTop=messages.scrollHeight});
</script></body></html>
