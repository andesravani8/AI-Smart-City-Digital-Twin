<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Simulator | Smart City Digital Twin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet"><link href="{{ url_for('static', filename='css/modules.css') }}" rel="stylesheet">
</head><body><div class="sc-page">
<div class="page-header"><h1><i class="bi bi-sliders2 me-2"></i>City Simulator</h1><p>Explore how changes in traffic, air quality and energy can affect the city.</p><span class="ml-badge"><i class="bi bi-bezier2"></i> WHAT-IF SCENARIO ANALYSIS</span></div>
<div class="glass-card"><div class="section-title"><i class="bi bi-toggles"></i>Scenario Inputs</div>
<form id="simForm"><div class="row g-4">
<div class="col-md-4"><label for="traffic">Traffic Change (%)</label><input id="traffic" type="number" min="-100" max="500" value="30" required></div>
<div class="col-md-4"><label for="air">Air Quality Change (%)</label><input id="air" type="number" min="-100" max="500" value="15" required></div>
<div class="col-md-4"><label for="energy">Energy Change (%)</label><input id="energy" type="number" min="-100" max="500" value="20" required></div>
</div><div class="mt-4"><button class="btn-main" id="simBtn" type="submit"><i class="bi bi-play-fill me-1"></i> RUN SIMULATION</button></div></form>
<div id="simLoading" class="loading">Running scenario analysis...</div><div id="simError" class="error-box"></div><div id="result" class="status-panel" style="color:#9caec4">Ready for simulation.</div></div>
</div><script>
document.getElementById('simForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('simBtn'),load=document.getElementById('simLoading'),err=document.getElementById('simError'),out=document.getElementById('result');err.style.display='none';load.style.display='block';btn.disabled=true;try{const r=await fetch('/api/simulator/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({traffic_change:Number(traffic.value),air_quality_change:Number(air.value),energy_change:Number(energy.value)})});const x=await r.json();if(!r.ok||!x.success)throw new Error(x.message||'Simulation failed.');const s=x.simulation.result||{};out.innerHTML=`<div class="row g-4"><div class="col-md-4"><div class="result-item"><span class="result-label">CITY STATUS</span><span class="result-value">${s.city_status??'--'}</span></div></div><div class="col-md-4"><div class="result-item"><span class="result-label">OVERALL IMPACT</span><span class="result-value">${s.overall_impact??'--'}%</span></div></div><div class="col-md-4"><div class="result-item"><span class="result-label">TRAFFIC IMPACT</span><span class="result-value">${s.traffic_impact??'--'}%</span></div></div></div><div class="impact-row"><div class="top"><span>Air Quality Impact</span><b>${s.air_quality_impact??0}%</b></div><div class="impact-bar"><span style="width:${Math.min(100,Math.abs(Number(s.air_quality_impact||0)))}%"></span></div></div><div class="impact-row"><div class="top"><span>Energy Impact</span><b>${s.energy_impact??0}%</b></div><div class="impact-bar"><span style="width:${Math.min(100,Math.abs(Number(s.energy_impact||0)))}%"></span></div></div>`;}catch(e){err.textContent=e.message;err.style.display='block'}finally{load.style.display='none';btn.disabled=false}});
</script></body></html>
